name: verify-25932

on:
  push:
    branches:
      - verify-25932-*

permissions:
  contents: read

jobs:
  downloads-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l pkg/storage/stores/shipper/indexshipper/downloads)"
      - name: go vet
        run: go vet ./pkg/storage/stores/shipper/indexshipper/downloads/
      - name: new tests
        run: go test ./pkg/storage/stores/shipper/indexshipper/downloads/ -run 'TestTable_CleanupBrokenCommonIndexSetKeepsUserIndexSets|TestTable_DropUnusedIndexRemovesTableDirectory' -count=1 -v
      - name: package tests
        run: go test ./pkg/storage/stores/shipper/indexshipper/downloads/ -count=1
      - name: golangci-lint (upstream v2.14.0 and config), whole package
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run -v --timeout 15m --build-tags linux ./pkg/storage/stores/shipper/indexshipper/downloads/...
      - name: golangci-lint, issues introduced by this change only
        if: always()
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run -v --timeout 15m --build-tags linux --new-from-rev=490023563a1523742eaf10bc88cd1921c91449a2 ./pkg/storage/stores/shipper/indexshipper/downloads/...
