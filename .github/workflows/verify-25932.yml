name: verify-25932

on:
  push:
    branches:
      - verify-25932-*

permissions:
  contents: read

jobs:
  downloads-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l pkg/storage/stores/shipper/indexshipper/downloads)"
      - name: go vet
        run: go vet ./pkg/storage/stores/shipper/indexshipper/downloads/
      - name: new tests
        run: go test ./pkg/storage/stores/shipper/indexshipper/downloads/ -run 'TestTable_CleanupBrokenCommonIndexSetKeepsUserIndexSets|TestTable_DropUnusedIndexRemovesTableDirectory' -count=1 -v
      - name: package tests
        run: go test ./pkg/storage/stores/shipper/indexshipper/downloads/ -count=1
